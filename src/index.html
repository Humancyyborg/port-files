<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Omniverse Federation</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Space+Mono:wght@400;700&display=swap');

  :root{
    --void:      #0b0a08;
    --paper:     #f4ecd9;
    --paper-dim: #e8dec5;
    --ink:       #1c1712;
    --gold:      #b9903f;
    --gold-dim:  #8a6b31;
    --rule:      rgba(28,23,18,0.55);
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:64px 20px;
    background:
      radial-gradient(ellipse at 50% 0%, #17140f 0%, var(--void) 60%);
    font-family:'Cormorant Garamond', serif;
  }

  .broadsheet{
    position:relative;
    width:100%;
    max-width:620px;
    background:
      linear-gradient(var(--paper), var(--paper-dim));
    color:var(--ink);
    padding:46px 44px 40px;
    box-shadow:
      0 2px 0 var(--gold-dim),
      0 40px 80px -20px rgba(0,0,0,0.85),
      0 0 0 1px rgba(0,0,0,0.6);
  }

  /* thin gold hairline frame, inset */
  .broadsheet::before{
    content:'';
    position:absolute;
    inset:12px;
    border:1px solid var(--gold-dim);
    pointer-events:none;
  }

  .eyebrow{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-family:'Space Mono', monospace;
    font-size:0.68em;
    letter-spacing:0.22em;
    text-transform:uppercase;
    color:var(--gold-dim);
    padding-bottom:10px;
    border-bottom:1px solid var(--rule);
  }

  h1{
    font-family:'Playfair Display', serif;
    font-weight:800;
    font-size:3.4em;
    line-height:0.95;
    letter-spacing:0.01em;
    text-align:center;
    margin:22px 0 6px;
  }

  .kicker{
    text-align:center;
    font-style:italic;
    font-size:1.05em;
    color:#4a4038;
    margin-bottom:18px;
  }

  .dateline{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:14px;
    font-family:'Space Mono', monospace;
    font-size:0.72em;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--ink);
    padding:10px 0 26px;
  }
  .dateline::before, .dateline::after{
    content:'';
    flex:1;
    height:1px;
    background:var(--rule);
  }

  .spiral{
    position:relative;
    margin:0 auto 8px;
    max-width:480px;
  }
  .spiral::after{
    content:'';
    position:absolute;
    inset:-30px;
    background: radial-gradient(circle at 50% 50%, rgba(185,144,63,0.18), transparent 70%);
    z-index:0;
    filter: blur(6px);
  }
  .spiral img{
    position:relative;
    z-index:1;
    width:100%;
    display:block;
    filter: drop-shadow(0 18px 30px rgba(0,0,0,0.35));
  }

  figcaption{
    text-align:center;
    font-family:'Space Mono', monospace;
    font-size:0.62em;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:#6b5f4f;
    margin-top:14px;
  }

  .headline{
    text-align:center;
    font-size:1.4em;
    font-style:italic;
    font-weight:500;
    margin:28px 0 4px;
    padding-top:22px;
    border-top:1px solid var(--rule);
  }

  .headline span{
    display:block;
    font-family:'Space Mono', monospace;
    font-style:normal;
    font-size:0.4em;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:var(--gold-dim);
    margin-bottom:8px;
  }

  @media (max-width:480px){
    .broadsheet{ padding:34px 24px 30px; }
    h1{ font-size:2.5em; letter-spacing:0.005em; }
  }
</style>
</head>
<body>

  <div class="broadsheet">
    <div class="eyebrow">
      <span>Vol. I</span>
      <span>Special Edition</span>
    </div>

    <h1>THE OMNIVERSE<br>FEDERATION</h1>
    <p class="kicker">Dispatches from Beyond the Known Continuum</p>

    <div class="dateline">JULY&nbsp;4,&nbsp;2026</div>

    <figure class="spiral">
      <img src="auva2.png" alt="Spiral portal">
      <!-- Change "auva2.png" to the actual filename of your saved image -->
      <figcaption>A rift observed at the edge of the mapped worlds</figcaption>
    </figure>

    <p class="headline">
      <span>Front Page</span>
      Portal to New Frontiers for Mankind
    </p>
  </div>

</body>
</html>
